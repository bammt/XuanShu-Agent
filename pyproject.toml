[project]
name = "xuanshu-platform"
version = "0.1.0"
description = "Production multi-tenant CrewAI orchestration and application platform"
authors = [{ name = "XuanShu" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.15,<2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.1",
    "minio>=7.2.15",
    "python-multipart>=0.0.20",
    "pwdlib[argon2]>=0.2.1",
    "PyJWT>=2.10.1",
    "pydantic-settings>=2.7.1",
    "alembic>=1.14.1"
    ,"httpx>=0.28.1"
    ,"python-docx>=1.1.2"
    ,"pypdf>=5.1.0"
    ,"openpyxl>=3.1.5"
    ,"qdrant-client>=1.15.0,<1.16.0"
    ,"openai>=1.75.0"
    ,"cryptography>=44.0.0"
    ,"PyYAML>=6.0.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xuanshu_platform"]

[tool.crewai]
type = "flow"
project_id = "caf3e20b-1fad-460a-a9c5-ca26e67650cc"

[dependency-groups]
dev = ["pytest>=8.3.4"]
